<meta name="description" content="{{ .Description | default .Summary }}">

<meta property="og:title" content="{{ .Title }} - {{ .Site.Title }}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{ .Permalink }}">
{{/* og:image は絶対URLが必須（partial の既定は相対なので abs: true を明示） */}}
<meta property="og:image" content="{{ partial "thumbnail.html" (dict "page" . "abs" true) }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Description | default .Summary }}">
<meta property="og:locale" content="ja_JP">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{ .Site.Title }}">
<meta name="twitter:url" content="{{ .Permalink }}">
<meta name="twitter:title" content="{{ .Title }} - {{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Description | default .Summary }}">
<meta name="twitter:image" content="{{ partial "thumbnail.html" (dict "page" . "abs" true) }}">
